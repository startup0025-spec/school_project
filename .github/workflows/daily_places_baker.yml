name: 🌊 Daily Busan Places Baker

# 매일 23:30 KST (UTC 14:30) 자동 실행
# 수동 실행: GitHub Actions 탭 → Run workflow
on:
  schedule:
    - cron: '30 14 * * *'   # UTC 14:30 = KST 23:30
  workflow_dispatch:          # 수동 실행 허용

jobs:
  bake-places:
    name: Bake optimized_places.json
    runs-on: ubuntu-latest

    permissions:
      contents: write  # GitHub Pages 브랜치 푸시를 위한 권한

    steps:
      # ── 1. 코드 체크아웃 ────────────────────────────────────
      - name: 📥 Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0  # 전체 히스토리 필요 (gh-pages 브랜치 접근용)

      # ── 2. Node.js 환경 설정 ────────────────────────────────
      - name: 🟢 Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      # ── 3. 이전 캐시 복원 (Differential Caching용) ──────────
      - name: 💾 Restore pipeline cache
        uses: actions/cache@v4
        with:
          path: scripts/pipeline/.cache_hashes.json
          key: places-cache-${{ runner.os }}-${{ hashFiles('scripts/pipeline/.cache_hashes.json') }}
          restore-keys: |
            places-cache-${{ runner.os }}-

      # ── 4. 메인 굽기 스크립트 실행 ──────────────────────────
      - name: 🔥 Run bake_places.js pipeline
        env:
          # ⚠️ 절대 이 파일에 API 키를 직접 쓰지 마세요.
          # 반드시 GitHub Repository Secrets에서만 주입됩니다.
          TOUR_API_KEY: ${{ secrets.TOUR_API_KEY }}
        run: node scripts/pipeline/bake_places.js

      # ── 5. 갱신된 캐시 저장 ────────────────────────────────
      - name: 💾 Save updated pipeline cache
        uses: actions/cache@v4
        with:
          path: scripts/pipeline/.cache_hashes.json
          key: places-cache-${{ runner.os }}-${{ hashFiles('scripts/pipeline/.cache_hashes.json') }}

      # ── 6. 생성된 JSON을 GitHub Pages 브랜치에 배포 ─────────
      - name: 🚀 Deploy optimized JSON to GitHub Pages
        run: |
          # GitHub Pages 브랜치 설정
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          # gh-pages 브랜치가 없으면 생성
          git fetch origin gh-pages 2>/dev/null || true

          # 임시 디렉토리에 JSON 복사
          mkdir -p /tmp/gh-pages-data
          cp mobile/assets/data/busan_places_master.json /tmp/gh-pages-data/

          # gh-pages 브랜치로 전환 (없으면 생성)
          git checkout gh-pages 2>/dev/null || git checkout --orphan gh-pages

          # data 폴더에 JSON 배포
          mkdir -p data
          cp /tmp/gh-pages-data/busan_places_master.json data/

          # 커밋 및 푸시
          git add data/busan_places_master.json
          git diff --staged --quiet || git commit -m "chore: update busan_places_master.json [$(date -u '+%Y-%m-%d %H:%M UTC')]"
          git push origin gh-pages

          echo "✅ GitHub Pages 배포 완료!"
          echo "✅ JSON URL: https://startup0025-spec.github.io/school_project/data/busan_places_master.json"
